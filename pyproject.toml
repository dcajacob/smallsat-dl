[project]
name = "smallsat-dl"
version = "0.1.0"
description = "CLI downloader for Small Satellite Conference proceedings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.13.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
]

[project.scripts]
smallsat-dl = "smallsat_dl.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
